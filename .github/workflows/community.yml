name: Publish community themes
on:
  push:
    branches: [main]
    paths: ['community/**', '.github/workflows/community.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-community-themes
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish immutable community assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          def gh(*args):
              return subprocess.check_output(['gh', *args], text=True)
          repo = '${{ github.repository }}'
          for path in sorted(pathlib.Path('community').glob('*/*/manifest.json')):
              data = json.loads(path.read_text())
              tag = data['tag']
              assert tag == data['id'] + '-v' + data['version']
              files = []
              for item in data['files']:
                  name = item['name']
                  assert pathlib.Path(name).name == name
                  file = path.parent / name
                  payload = file.read_bytes()
                  assert len(payload) == item['size'] and hashlib.sha256(payload).hexdigest() == item['sha256'], name
                  files.append((file, 'sha256:' + item['sha256']))
              files.append((path, 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest()))
              exists = subprocess.run(['gh', 'release', 'view', tag], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0
              if not exists:
                  gh('release', 'create', tag, '--title', data['name'] + ' ' + data['version'], '--notes', 'Community theme and sample-data showcase. Source: https://github.com/' + data['source']['repo'] + '/commit/' + data['source']['commit'], '--draft', '--prerelease', '--latest=false')
              release = json.loads(gh('api', 'repos/' + repo + '/releases/tags/' + tag))
              existing = {a['name']: a for a in release['assets']}
              for file, digest in files:
                  if file.name in existing:
                      assert existing[file.name].get('digest') == digest, 'Immutable asset differs: ' + file.name
                  else:
                      gh('release', 'upload', tag, str(file))
              gh('release', 'edit', tag, '--draft=false', '--prerelease', '--latest=false')
          PY
